name: Update Snapshot Versions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.15.2
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - name: Install Packages
        run: pip install -r requirements.txt
      - name: Execute program
        run: |
          export PYTHONPATH="$PYTHONPATH:$PWD"
          python src/app.py snapshot
        id: execute-program
      - name: Commit changes
        uses: EndBug/add-and-commit@v11
        with:
          author_name: automation
          author_email: action@github.com
          message: 'Update snapshot.json: Added Versions: ${{ steps.execute-program.outputs.ADDED_VERSIONS }}'
          add: 'snapshot.json'